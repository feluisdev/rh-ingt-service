###### DEV PIPELINE ######
image: docker:27.3.1
services:
  - name: docker:27.3.1-dind
    alias: docker 
    command: [ "--tls=false", "--mtu=1240" ]
#    privileged: true
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  REGISTRY_URL: "registry.nosi.cv"
  REGISTRY_PROJECT: "ingt"
  IMAGE_NAME: "sipprog-rh-backend"
  GIT_STRATEGY: none

stages:
  - clean
  - build
#  - deploy

clean_database_dev:
  stage: clean
  image: maven:3.9.9-eclipse-temurin-23-alpine
  tags:
    - nosi-runner
  only:
    - dev
  script:
    - mvn flyway:clean -Dflyway.cleanDisabled=false
  variables:
    # Estas variáveis devem ser configuradas no GitLab (CI/CD Variables)
    # ou passadas via environment
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_DATABASE: ${POSTGRES_DATABASE}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

build_docker_image_dev:
  stage: build
  tags:
    - nosi-runner
  only:
    - dev
    #- version/demo-stable
  script:
    - apk add --no-cache git
    - git clone https://$GIT_USERNAME:$GIT_PASSWORD@git.nosi.cv/sipprog/backends/sipprog-rh-backend.git .
    - docker login $REGISTRY_URL -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD" 
    - docker build -t $REGISTRY_URL/$REGISTRY_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID .
    - docker tag $REGISTRY_URL/$REGISTRY_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID $REGISTRY_URL/$REGISTRY_PROJECT/$IMAGE_NAME:latest
    - docker push $REGISTRY_URL/$REGISTRY_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID
    - docker push $REGISTRY_URL/$REGISTRY_PROJECT/$IMAGE_NAME:latest
