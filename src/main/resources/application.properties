# ---------------------------------------------
# General Configuration
# ---------------------------------------------
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false
spring.application.name=${SPRING_APPLICATION_NAME:sipprog-rh-backend}
spring.profiles.active=${SPRING_ACTIVE_PROFILE:${SERVICE_PROFILE:development}}
server.port=${SERVICE_PORT:8080}
server.shutdown=graceful
# ---------------------------------------------
# Service Discovery
# ---------------------------------------------
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
spring.cloud.kubernetes.discovery.enabled=${KUBERNETES_DISCOVERY_ENABLED:false}
# ---------------------------------------------
# Datasource
# ---------------------------------------------
# DATABASE_URL tem precedencia; na falta dela o URL e composto das POSTGRES_*
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:recursoshumanos_db}}
spring.datasource.username=${DATABASE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
# ---------------------------------------------
# Flyway
# ---------------------------------------------
spring.flyway.enabled=${ENABLE_FLYWAY:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:true}
spring.flyway.clean-disabled=${FLYWAY_CLEAN_DISABLED:false}
# TODO: remove after next successful deploy (fixes V17 checksum mismatch)
spring.flyway.repair-on-migrate=true
# ---------------------------------------------
# JPA and Hibernate settings
# ---------------------------------------------
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.show-sql=${ENABLE_HIBERNATE_SQL:true}
spring.jpa.properties.hibernate.format_sql=${ENABLE_HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Audit tables go into a dedicated schema (created by V19)
spring.jpa.properties.org.hibernate.envers.default_schema=audit_schema
# Track entity names modified during a revision
#spring.jpa.properties.org.hibernate.envers.track_entities_changed_in_revision=true
# Enable withModifiedFlag globally (adds _MOD columns; enable when RevisionEntity is customised)
#spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true
# Spring Data REST
spring.data.rest.detection-strategy=annotated
# ---------------------------------------------
# Cache
# ---------------------------------------------
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s
spring.cache.cache-names=reference-options
# ---------------------------------------------
# Logging (common defaults)
# ---------------------------------------------
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:INFO}
logging.level.cv.igrp.RH-Service=${LOGGING_LEVEL_APP:INFO}
logging.level.io.opentelemetry=WARN
# ---------------------------------------------
# Authentication
# ---------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_JWT_ISSUER}
# Set SECURITY_ENABLED=false in .env to disable auth enforcement (token is still parsed when present)
app.security.enabled=${SECURITY_ENABLED:true}
# --------------------------------------------------------
# IGRP Access (M2M)
# --------------------------------------------------------
# Credenciais que a sincronizacao de permissoes com a plataforma de gestao de acessos IGRP
# (AuthorizationSyncRunner) exige no arranque. Omissao vazia em todas: sem client-id e
# client-secret preenchidos, o runner regista um WARN a dizer que nao ha client_credentials,
# cai no modo legado obsoleto (sync-token) e, falhando tambem esse, apanha a excecao da chamada
# HTTP e regista-a em error -- em nenhum caso o arranque do servico falha por causa disto
# (Fase 115, AUT-05, parte declarativa; a observacao fica para o plano 09).
igrp.access.api.base-url=${IGRP_ACCESS_API_BASE_URL:}
igrp.access.m2m.client-id=${IGRP_ACCESS_M2M_CLIENT_ID:}
igrp.access.m2m.client-secret=${IGRP_ACCESS_M2M_CLIENT_SECRET:}
igrp.access.m2m.scope=${IGRP_ACCESS_M2M_SCOPE:}
# igrp.access.m2m.sync-token esta marcado @Deprecated no framework (modo legado); nao declarado
# aqui de proposito -- nao deve ser usado.
#
# Fase 115 (AUT-03/AuthorizationWiringConfig): exclui por nome a autoconfiguracao do jar
# cv.igrp.framework.auth:core-spring-boot. Essa classe e bytecode major version 70 (JDK 26);
# o ASM embutido no Spring Framework 6.2.8 so le ate major 69, pelo que qualquer referencia a
# ela por ".class" (incluindo em @Import) faz o Spring rebentar com ClassFormatException ao
# tentar parseia-la. Excluir por nome, em propriedade, evita esse parse. O unico bean que essa
# autoconfiguracao fornecia (igrpApiClient) e declarado manualmente em AuthorizationWiringConfig.
spring.autoconfigure.exclude=cv.igrp.framework.auth.core.autoconfig.AutoConfiguration
# ---------------------------------------------
# Swagger Documentation
# ---------------------------------------------
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.docExpansion=none
# ---------------------------------------------
# File Storage (MinIO S3)
# ---------------------------------------------
igrp.minio.url=${MINIO_URL:http://127.0.0.1:9000}
igrp.minio.port=${MINIO_PORT:9000}
igrp.minio.security=${MINIO_SECURITY:false}
igrp.minio.access-key=${MINIO_ACCESS_KEY}
igrp.minio.secret-key=${MINIO_SECRET_KEY}
igrp.minio.bucket-name=${MINIO_BUCKET_NAME:rh-bucket}
igrp.minio.url-expiration-time=${MINIO_PRESIGNED_URL_EXPIRATION_TIME:3600}
logging.level.io.minio=${LOGGING_LEVEL_MINIO:DEBUG}
logging.level.cv.igrp.platform.filemanager=${LOGGING_LEVEL_FILEMANAGER:DEBUG}
# ---------------------------------------------
# Agendadores SIGDI/PAA
# ---------------------------------------------
# Fecho automático do período de submissão expirado (PRZ-02, Fase 117) — corre às 00:30,
# meia hora antes dos três agendadores das 01:00, para que o estado dos períodos esteja
# assente antes de eles correrem. Sobreponível por PAA_SUBMISSION_PERIOD_EXPIRY_CRON.
sigdi.paa.submission-period-expiry.cron=${PAA_SUBMISSION_PERIOD_EXPIRY_CRON:0 30 0 * * ?}
# Geração automática de formulários na abertura do período (PRZ-01, Fase 119) — corre às
# 00:45, depois do fecho por expiração acima e antes dos três agendadores das 01:00, para que
# um período que expirou esta noite já esteja CLOSED quando este varrimento correr.
# Sobreponível por PAA_FORM_GENERATION_CRON. Os dois interruptores existem porque a criação em
# massa não tem inverso até à Fase 120 -- sem eles, "desligar" exigiria tocar em código.
sigdi.paa.form-generation.cron=${PAA_FORM_GENERATION_CRON:0 45 0 * * ?}
sigdi.paa.form-generation.enabled=${PAA_FORM_GENERATION_ENABLED:true}
sigdi.paa.form-generation.dry-run=${PAA_FORM_GENERATION_DRY_RUN:false}
# ---------------------------------------------
# Observability
# ---------------------------------------------
otel.resource.attributes.service.name=${spring.application.name}
otel.resource.attributes.deployment.environment=${spring.profiles.active}
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}
otel.sdk.disabled=${OTEL_DISABLED:true}
