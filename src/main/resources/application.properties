# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.application.name=RecursosHumanos
# Default profile
spring.profiles.active=${SPRING_ACTIVE_PROFILE:development}

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s
spring.cache.cache-names=reference-options