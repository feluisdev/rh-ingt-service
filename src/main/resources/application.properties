# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.application.name=${SERVICE_NAME:recursoshumanos-service}
# Default profile
spring.profiles.active=${SPRING_ACTIVE_PROFILE:development}
spring.jpa.properties.org.hibernate.envers.default_schema=audit_schema

server.shutdown=graceful

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s
spring.cache.cache-names=reference-options

# IGRP Access
igrp.access.api.base-url=${IGRP_ACCESS_API_BASE_URL:}

# Security toggle — set SECURITY_ENABLED=false in .env to disable auth enforcement (token is still parsed when present)
app.security.enabled=${SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_JWT_ISSUER}

# PAA submission-period role name — set PAA_SUBMISSION_PERIOD_ROLE to override the
# Keycloak/IAM realm role required to open/close PAA submission periods (ACH-A-01)
sigdi.paa.submission-period-role=${PAA_SUBMISSION_PERIOD_ROLE:RH}

# Observability
otel.resource.attributes.service.name=${spring.application.name}
otel.resource.attributes.deployment.environment=${spring.profiles.active}
otel.logs.exporter=otlp
otel.metrics.exporter=otlp
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}
otel.sdk.disabled=${OTEL_DISABLED:true}
logging.level.io.opentelemetry=WARN
